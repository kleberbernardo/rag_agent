name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless: cancel it instead of
# queueing both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result instead of stopping at the first
      # failure: a Windows-only break is exactly what this matrix is for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch comes with the guardrails, and the wheel PyPI serves on Linux
      # bundles the CUDA runtime: roughly three gigabytes of nvidia libraries
      # for a runner with no GPU. Installing it from the CPU index first means
      # pip already has it satisfied when the project asks.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # Integration tests reach the real embeddings API. They stay out of CI:
      # a public repository has no business holding an API key, and every
      # push would cost tokens.
      - name: Tests
        run: pytest -m "not integration" --cov=rag_agent --cov-report=term-missing

  # The SQL only runs here. A DELETE with a wrong WHERE passes every unit test
  # and empties the index in production, so the store is exercised against a
  # real Postgres. The embeddings are faked in these tests, which is what lets
  # them run without an API key.
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # The application never migrates itself, so the suite does not either.
      - name: Migrate
        run: alembic upgrade head

      - name: Tests
        run: pytest -m integration

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's default buildx driver cannot export a cache. The
      # container driver can, and that is what makes cache-to below work.
      - uses: docker/setup-buildx-action@v3

      # Building the image on every push is what keeps the Dockerfile honest:
      # a dependency or a path that only works on the author's machine shows
      # up here instead of in front of whoever tries to run the project.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rag-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm --entrypoint rag rag-agent:ci --help
