services:
  # Standalone vector store. Running it as its own service is the point of
  # VECTOR_STORE_MODE=server: the index survives, restarts and scales
  # independently of the application container.
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      # The image ships neither curl nor wget, so the probe is bash opening a
      # socket. It asks the real endpoint rather than only checking the port,
      # because an open port does not mean the API is answering yet.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8000 &&
          printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q nanosecond <&3
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Session storage. Without it the chat endpoint keeps conversations in the
  # process that served them, so a second replica would not see them and a
  # restart would forget them.
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: rag-agent:local
    container_name: rag-agent-api
    ports:
      - "8080:8080"
    depends_on:
      chroma:
        # Without service_healthy the CLI would start before Chroma answers
        # and fail on the first command.
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?defina OPENAI_API_KEY no ambiente ou num arquivo .env}
      KNOWLEDGE_DOMAIN: ${KNOWLEDGE_DOMAIN:-regulação do mercado de capitais brasileiro (resoluções da CVM)}
      VECTOR_STORE_MODE: server
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      # Optional. Set it and every request needs the X-API-Key header.
      API_KEY: ${API_KEY:-}
      # Optional. Compose reads these from your .env; empty means no tracing.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # Read-only: the corpus is an input. Swapping documents needs no rebuild.
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  chroma-data:
  redis-data:
