[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG in Python: LangChain, LangGraph and Postgres with pgvector. Hybrid retrieval fused by RRF, guardrails, and six graded metrics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-postgres>=0.0.17,<1",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # The primitive behind slowapi and flask-limiter. Used directly because
    # slowapi cannot find routes registered through include_router.
    "limits>=3.0,<6",
    "openai>=3.6,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "pypdf>=6.16,<7",
    "typer>=0.27,<1",
    "rich>=15.0,<16",
    "langfuse>=4.15,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "redis>=5.2,<9",
    # Guardrails. torch and transformers come with it, which is why the
    # reranker below costs almost nothing on top.
    "llm-guard>=0.3.16,<1",
    "sentence-transformers>=3.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
rag = "rag_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Four workers, not `auto`. Each worker loads the guardrail models into its
# own process, so past four the memory pressure costs more than the
# parallelism buys and workers start crashing. Measured on this suite:
# 89s sequential, 89s at auto (eight workers, three crashes), 46s at four.
addopts = "-q --strict-markers -n 4"
markers = [
    "integration: exige rede ou chave de API real",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["rag_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
