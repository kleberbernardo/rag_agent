[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG over your own documents: LangChain, LangGraph, Postgres with pgvector and tool calling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-postgres>=0.0.17,<1",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "openai>=3.6,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "pypdf>=6.16,<7",
    "typer>=0.27.2,<1",
    "rich>=15.0,<16",
    "langfuse>=4.15,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "redis>=5.2,<9",
]

[project.optional-dependencies]
# A cross-encoder runs locally, which means torch. That is roughly 2 GB of
# wheels for a second pass that is off by default, so it stays out of the
# runtime image until someone turns reranking on.
rerank = [
    "sentence-transformers>=3.0,<7",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
rag = "rag_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: exige rede ou chave de API real",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["rag_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
